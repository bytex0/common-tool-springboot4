name: Maven Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify common starter HTTP API
        run: python3 scripts/test-starter.py common --skip-build
      - name: Verify IP region starter HTTP API
        run: python3 scripts/test-starter.py ip2region --skip-build
      - name: Verify sensitive word starter HTTP API
        run: python3 scripts/test-starter.py sensitive-word --skip-build
      - name: Verify Disruptor starter HTTP API
        run: python3 scripts/test-starter.py disruptor --skip-build
      - name: Verify local cache starter HTTP API
        run: python3 scripts/test-starter.py local-cache --skip-build
      - name: Verify documentation starter HTTP API
        run: python3 scripts/test-starter.py docs --skip-build
      - name: Verify Excel starter HTTP API
        run: python3 scripts/test-starter.py excel --skip-build
      - name: Verify i18n starter HTTP API
        run: python3 scripts/test-starter.py i18n --skip-build
      - name: Verify desensitize starter HTTP API
        run: python3 scripts/test-starter.py desensitize --skip-build
      - name: Verify dictionary starter HTTP API
        run: python3 scripts/test-starter.py dict --skip-build
      - name: Verify multi Redis starter HTTP API
        run: python3 scripts/test-starter.py multi-redis --skip-build
      - name: Verify lock starter HTTP API
        run: python3 scripts/test-starter.py lock --skip-build
      - name: Verify rate limiter starter HTTP API
        run: python3 scripts/test-starter.py rate-limiter --skip-build
      - name: Verify idempotency starter HTTP API
        run: python3 scripts/test-starter.py idempotent --skip-build
