name: Maven Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify common starter HTTP API
        run: python3 scripts/test-starter.py common --skip-build
      - name: Verify local cache starter HTTP API
        run: python3 scripts/test-starter.py local-cache --skip-build
      - name: Verify documentation starter HTTP API
        run: python3 scripts/test-starter.py docs --skip-build
