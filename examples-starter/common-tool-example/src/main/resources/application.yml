spring:
  application:
    name: common-tool-example

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

common-tool:
  enabled: true
  application-info-enabled: true
  metadata:
    enabled: true
  nlp:
    hanlp-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
